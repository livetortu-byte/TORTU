<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07262b" />
  <meta name="description" content="Overlay Tortulive para carreras en directo." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Overlay Tortugas</title>
  <script src="/api-config.js"></script>
  <script src="/pwa-runtime.js"></script>
  <script src="/overlay-coordinator.js?v=18"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    @media (display-mode: fullscreen), (display-mode: standalone) {
      html, body { background: #000; }
    }

    .stage {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
      transform-origin: center;
    }

    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
      background: transparent;
    }

    .footer-reserved {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: block;
      height: 100px;
      z-index: 18;
      border-top: 2px solid rgba(242,194,48,.65);
      background: #000;
      cursor: pointer;
    }
    .connection-badge {
      position: absolute;
      left: 24px;
      bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border: 3px solid rgba(255,255,255,.9);
      border-radius: 50%;
      box-sizing: border-box;
      color: #fff;
      font: 700 24px Arial, sans-serif;
      text-shadow: 0 1px 2px rgba(0,0,0,.7);
      pointer-events: none;
    }
    .connection-badge.connected { background: #16a34a; }
    .connection-badge.retrying { background: #eab308; color: #1c1917; text-shadow: none; }
    .connection-badge.disconnected { background: #dc2626; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .fondo { z-index: 1; }
    .pista { z-index: 2; }
    .ruta { z-index: 2; }
    .meta { z-index: 3; }
    .progreso1 { z-index: 4; }
    .progreso2 { z-index: 5; }
    .bandera1 { z-index: 6; }
    .bandera2 { z-index: 7; }
    .estadisticas { z-index: 10; }
    .tortuga1 { z-index: 8; }
    .tortuga2 { z-index: 9; }
    .eventos { z-index: 10; }
    .don { z-index: 10; }
    .alertas { z-index: 11; }
    .agradecimiento { z-index: 12; }
    .contadores { z-index: 13; }
    .ganador { z-index: 14; }
    .iconos { z-index: 15; }
    .regalos { z-index: 16; }

    .click-zone {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 90px;
      z-index: 20;
      cursor: pointer;
      background: transparent;
    }

    .gift-zone {
      position: absolute; top: 0; right: 0; width: 120px; height: 120px; z-index: 22;
      padding: 0; border: 0; background: transparent; opacity: 0; cursor: pointer;
    }
    .session-zone {
      position: absolute;
      top: 0;
      left: 0;
      width: 72px;
      height: 72px;
      z-index: 21;
      padding: 0;
      border: 0;
      background: transparent;
      opacity: 0;
      cursor: pointer;
    }
    .sound-toggle {
      position: absolute;
      right: 20px;
      bottom: 22px;
      z-index: 23;
      min-width: 116px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #c99b3b;
      border-radius: 20px;
      background: rgba(33,19,8,.95);
      color: #fff;
      font: 700 14px Arial, sans-serif;
      cursor: pointer;
    }
    .sound-toggle[aria-pressed="true"] { color: #f7c948; }
    .voice-toggle { right: 146px; min-width: 96px; }
    .voice-test { right: 250px; width: 44px; min-width: 44px; padding: 0; }
    .sound-hud {
      position: absolute; right: 20px; bottom: 70px; z-index: 23; display: none; min-width: 222px; box-sizing: border-box;
      padding: 6px 12px 8px; border: 1px solid #c99b3b; border-radius: 14px; background: rgba(33,19,8,.95);
      color: #fff; font: 700 14px Arial, sans-serif; pointer-events: none;
    }
    .sound-hud.is-on { display: block; }
    .sound-hud .row { display: flex; justify-content: space-between; gap: 10px; }
    .sound-hud .combo { color: #f7c948; }
    .sound-hud .bar { margin-top: 5px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); overflow: hidden; }
    .sound-hud .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #fbbf24, #f97316); transition: width .3s; }

  </style>
</head>
<body>
  <div class="stage">
    <iframe class="layer fondo" src="/layers/fondo.html"></iframe>
    <iframe class="layer pista" src="/layers/pista.html"></iframe>
    <iframe class="layer ruta" src="/layers/ruta.html"></iframe>
    <iframe class="layer meta" src="/layers/meta.html"></iframe>
    <iframe class="layer progreso1" src="/layers/progreso-1.html"></iframe>
    <iframe class="layer progreso2" src="/layers/progreso-2.html"></iframe>
    <iframe class="layer bandera1" src="/layers/bandera-1.html"></iframe>
    <iframe class="layer bandera2" src="/layers/bandera-2.html"></iframe>
    <iframe class="layer estadisticas" src="/layers/estadisticas-equipos.html"></iframe>
    <iframe class="layer tortuga1" src="/layers/tortuga-1.html"></iframe>
    <iframe class="layer tortuga2" src="/layers/tortuga-2.html"></iframe>
    <iframe class="layer eventos" src="/layers/eventos-ruta.html"></iframe>
    <iframe class="layer don" src="/layers/don-tortu.html"></iframe>
    <iframe class="layer alertas" src="/layers/alertas.html"></iframe>
    <iframe class="layer agradecimiento" src="/layers/agradecimiento.html"></iframe>
    <iframe class="layer contadores" src="/layers/contadores.html"></iframe>
    <iframe class="layer ganador" src="/layers/ganador.html"></iframe>
    <iframe class="layer iconos" src="/layers/iconos.html"></iframe>
    <iframe class="layer regalos" src="/layers/regalos.html"></iframe>
    <a id="overlayFooter" class="footer-reserved" aria-label="Abrir dashboard">
      <span id="connectionBadge" class="connection-badge disconnected" title="TikTok · Desconectado" aria-label="TikTok · Desconectado">?</span>
      <span class="visually-hidden">Abrir dashboard</span>
    </a>
    <div class="click-zone" title="Abrir configuración" onclick="window.open('/dashboard.html', '_blank')"></div>
    <button class="gift-zone" type="button" aria-label="Probar regalo"></button>
    <button class="session-zone" type="button" aria-label="Cerrar sesión" title="Cerrar sesión"></button>
    <button id="voiceToggle" class="sound-toggle voice-toggle" type="button" aria-pressed="true" title="Silenciar la voz">🎙️ Voz</button>
    <button id="voiceTest" class="sound-toggle voice-test" type="button" aria-label="Probar la voz en off" title="Probar la voz en off">🧪</button>
    <button id="soundToggle" class="sound-toggle" type="button" aria-pressed="false" title="Activar sonidos">🔇 Sonido</button>
    <div id="soundHud" class="sound-hud" aria-hidden="true">
      <div class="row"><span id="hudLevel">Nivel 1</span><span id="hudCombo" class="combo"></span></div>
      <div class="bar"><i id="hudBar"></i></div>
    </div>
  </div>
  <script src="/layers/event-sounds.js"></script>
  <script>
    const stage = document.querySelector('.stage');
    const apiBase = (window.TORTULIVE_API_BASE_URL || '').replace(/\/+$/, '');
    function fitStage() {
      const viewport = window.visualViewport;
      const width = viewport ? viewport.width : innerWidth;
      const height = viewport ? viewport.height : innerHeight;
      stage.style.setProperty('--stage-scale', Math.min(width / 1080, height / 1920));
    }
    addEventListener('resize', fitStage);
    window.visualViewport?.addEventListener('resize', fitStage);
    window.visualViewport?.addEventListener('scroll', fitStage);
    fitStage();

    document.querySelector('.session-zone').addEventListener('click', async () => {
      try {
        const response = await fetch(apiBase + '/api/auth/logout', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' }
        });
        if (!response.ok) throw new Error('Logout API responded with ' + response.status);
      } catch (error) {
        console.error('No se pudo cerrar la sesión:', error);
      }
    });

    const soundToggle = document.getElementById('soundToggle');
    soundToggle.addEventListener('click', async event => {
      event.preventDefault();
      event.stopPropagation();
      try {
        const enabled = window.TortuSound.isEnabled()
          ? window.TortuSound.disable()
          : await window.TortuSound.enable();
        soundToggle.textContent = enabled ? '🔊 Sonido' : '🔇 Sonido';
        document.getElementById('soundHud').classList.toggle('is-on', enabled);
        soundToggle.setAttribute('aria-pressed', String(enabled));
        soundToggle.title = enabled ? 'Silenciar sonidos' : 'Activar sonidos';
      } catch (error) {
        soundToggle.title = 'No se pudieron activar los sonidos';
        console.error('No se pudieron activar los sonidos:', error);
      }
    });

    const voiceToggle = document.getElementById('voiceToggle');
    if (!window.TortuSound.hasVoice()) {
      voiceToggle.disabled = true;
      voiceToggle.title = 'Este navegador no tiene voz en off';
    }
    voiceToggle.addEventListener('click', event => {
      event.preventDefault();
      event.stopPropagation();
      const on = window.TortuSound.setVoice(!window.TortuSound.isVoiceEnabled());
      voiceToggle.setAttribute('aria-pressed', String(on));
      voiceToggle.textContent = on ? '🎙️ Voz' : '🔕 Voz';
      voiceToggle.title = on ? 'Silenciar la voz' : 'Activar la voz';
    });
    const voiceTest = document.getElementById('voiceTest');
    voiceTest.addEventListener('click', async event => {
      event.preventDefault();
      event.stopPropagation();
      voiceTest.disabled = true;
      voiceTest.title = 'Reproduciendo la prueba de voz...';
      try {
        await window.TortuSound.testVoice();
        voiceToggle.setAttribute('aria-pressed', 'true');
        voiceToggle.textContent = '🎙️ Voz';
        voiceToggle.title = 'Silenciar la voz';
        voiceTest.title = 'La prueba de voz terminó correctamente';
      } catch (error) {
        voiceTest.title = error.message;
        console.error('Falló la prueba de voz:', error);
      } finally {
        voiceTest.disabled = false;
      }
    });

    window.TortuSound.onChange(stats => {
      document.getElementById('hudLevel').textContent = 'Nivel ' + stats.level + ' · ' + stats.xp + ' XP';
      document.getElementById('hudCombo').textContent = stats.combo >= 3 ? '🔥 x' + stats.combo : '';
      document.getElementById('hudBar').style.width = Math.min(100, stats.xpIntoLevel / stats.xpForNext * 100) + '%';
    });

    window.addEventListener('message', event => {
      const eventLayer = document.querySelector('.eventos');
      if (event.origin !== location.origin || event.source !== eventLayer.contentWindow
        || !event.data || event.data.channel !== 'tortulive-sound') return;
      const d = event.data;
      window.TortuSound.play(d.kind, d.count, {
        user: typeof d.user === 'string' ? d.user : '',
        team: typeof d.team === 'string' ? d.team : '',
        text: typeof d.text === 'string' ? d.text : '',
        delta: d.delta,
        bump: d.bump === true
      });
    });

    // Clic arriba a la derecha = simula un regalo (varios clics seguidos = más regalos del mismo usuario y equipo).
    (function () {
      const NAMES = ['maria_g', 'juanpi', 'lucho10', 'sofi.tv', 'carlitos', 'ana_lu', 'pepe77', 'valen'];
      const COLORS = ['#e11d48', '#f97316', '#22c55e', '#06b6d4', '#6366f1', '#a855f7', '#ec4899'];
      let team = 1, user = NAMES[0], color = COLORS[0], last = 0;
      document.querySelector('.gift-zone').addEventListener('click', () => {
        const now = Date.now();
        if (now - last > 2000) {
          team = 1 - team;
          const i = Math.floor(Math.random() * NAMES.length);
          user = NAMES[i]; color = COLORS[i % COLORS.length];
        }
        last = now;
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="' + color + '"/><circle cx="32" cy="26" r="12" fill="#fde68a"/><path d="M8 64c0-16 12-22 24-22s24 6 24 22z" fill="#fde68a"/></svg>';
        const message = { type: 'event', event: 'gift', user, team: team + 1, count: 1, gift: 'Rosa', avatar: 'data:image/svg+xml;utf8,' + encodeURIComponent(svg) };
        document.querySelectorAll('.layer').forEach(layer => {
          layer.contentWindow?.postMessage({ channel: 'tortulive', message }, location.origin);
        });
      });
    })();

    const overlayMatch = location.pathname.match(/^\/overlay\/([a-f0-9]{24})$/);
    // En el overlay público (URL con id) no se ofrece el atajo al panel: lo ven los espectadores.
    if (overlayMatch) {
      document.querySelector('.click-zone')?.remove();
      document.querySelector('.session-zone')?.remove();
      const footer = document.getElementById('overlayFooter');
      footer.href = '/dashboard.html';
      footer.target = '_top';
    } else {
      document.getElementById('overlayFooter')?.remove();
    }
    if (overlayMatch && window.TortuOverlayCoordinator) {
      window.TortuOverlayCoordinator.start({ publicId: overlayMatch[1], apiBase });
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js', { updateViaCache: 'none' })
        .then(registration => registration.update())
        .catch(error => console.error('No se pudo actualizar el service worker:', error));
    }
  </script>
</body>
</html>
