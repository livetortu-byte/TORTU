<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101820">
<link rel="manifest" href="manifest.webmanifest">
<title>Carrera de Tortugas</title>
<style>
  :root{
    --bg:#101820; --track:#1d2b36;
    --cerro:#0d3b9e; --cerro2:#d3202f;
    --oli:#ffffff; --oli2:#111111;
    --paso:1.4s;                      /* duración de cada pisada: más alto = más lenta */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);font-family:Arial Black,Arial,Helvetica,sans-serif;overflow:hidden}
  /* FORMATO TikTok LIVE VERTICAL 9:16: en pantalla ancha (PC) se centra un lienzo 9:16;
     en el teléfono en vertical ocupa todo el ancho. */
  :root{--safe-top:0px;--safe-bottom:0px}
  body.live{--safe-top:64px;--safe-bottom:120px}   /* ?live=1: deja libre lo que tapa la interfaz de TikTok (arriba: perfil; abajo: chat) */
  #app{position:relative;height:100%;width:min(100vw,calc(100vh * 9 / 16));margin:0 auto;display:flex;flex-direction:column;
    padding-bottom:var(--safe-bottom)}
  #connectionIndicator{position:absolute;left:8px;bottom:8px;z-index:11;width:14px;height:14px;border:2px solid #fff;
    border-radius:50%;box-shadow:0 0 8px #000;background:#facc15}
  #connectionIndicator[data-state="connected"]{background:#22c55e}
  #connectionIndicator[data-state="failed"]{background:#ef4444}

  /* CABECERA */
  #head{display:flex;height:calc(106px + var(--safe-top));padding-top:var(--safe-top);flex:0 0 auto}
  .team{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff}
  /* CAPA 1: bandera + nombre */
  .capa-bandera{display:flex;flex-direction:column;align-items:center;gap:2px}
  /* CAPA 2: barra horizontal de desplazamiento + metraje */
  .capa-desp{position:relative;width:calc(100% - 16px);height:30px;background:#000000aa;
    border:3px solid #fff;border-radius:16px;overflow:hidden}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0%}
  .fill.cerro{background:repeating-linear-gradient(90deg,var(--cerro) 0 10px,var(--cerro2) 10px 20px)}
  .fill.oli{background:repeating-linear-gradient(90deg,var(--oli) 0 10px,var(--oli2) 10px 20px)}
  .flag{width:64px;height:40px;border:3px solid #fff;border-radius:4px}
  .flag.cerro{background:repeating-linear-gradient(90deg,var(--cerro) 0 10px,var(--cerro2) 10px 20px)}
  .flag.oli{background:repeating-linear-gradient(90deg,var(--oli) 0 10px,var(--oli2) 10px 20px)}
  .dist{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;
    white-space:nowrap;text-shadow:-2px 0 #000,2px 0 #000,0 -2px #000,0 2px #000,0 0 6px #000}
  .tname{font-size:20px;letter-spacing:1px;text-transform:uppercase}

  /* PISTA */
  #trackwrap{position:relative;flex:1;display:flex;overflow:hidden}
  .lane{position:relative;flex:1;
    background:
      repeating-linear-gradient(0deg,transparent 0 59px,#ffffff14 59px 60px),
      linear-gradient(90deg,#1a2833,#22333f 50%,#1a2833)}
  .lane + .lane{border-left:4px dashed #ffffff55}
  #finish{position:absolute;left:0;right:0;top:0;height:28px;z-index:3;
    background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/28px 28px;
    border-bottom:3px solid #fff}
  #start{position:absolute;left:0;right:0;bottom:0;height:8px;background:#ffffff55;z-index:1}

  /* TORTUGA (crece desde la base; con regalo llega a 3 veces su tamaño) */
  .turtle{position:absolute;left:50%;width:110px;height:138px;margin-left:-55px;z-index:2;
    transform-origin:50% 100%;will-change:transform}
  .turtle svg{width:100%;height:100%;display:block;overflow:visible;
    animation:sway calc(var(--paso)) ease-in-out infinite alternate;transform-origin:50% 55%}
  @keyframes sway{from{transform:rotate(-2.5deg) translateY(1.5px)}to{transform:rotate(2.5deg) translateY(-1.5px)}}   /* el caparazón se balancea y avanza al ritmo de las patas */

  /* patas: caminan hacia delante y atrás, en diagonal y despacio */
  .leg{animation:paso var(--paso) ease-in-out infinite alternate}
  .leg.b{animation-direction:alternate-reverse}
  @keyframes paso{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
  .turtle svg,.leg{animation-play-state:paused}                    /* quietas si no avanza */
  .turtle.walk svg,.turtle.walk .leg{animation-play-state:running}   /* caparazón y patas arrancan y paran JUNTOS */
  #app.stop .leg,#app.stop .turtle svg{animation-play-state:paused}

  /* ALERTAS (avatar + icono de la acción). Cerro a la izquierda, Olimpia a la derecha */
  #alerts{position:absolute;left:6px;right:6px;bottom:8px;z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .toast{display:flex;padding:0 10px 10px 0;animation:tin .25s ease-out}
  .toast.cerro{align-self:flex-start}
  .toast.oli{align-self:flex-end}
  .toast.out{opacity:0;transform:translateY(8px);transition:.3s}
  @keyframes tin{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
  .av{position:relative;flex:0 0 auto;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:32px;border:3px solid #fff}
  .badge{position:absolute;right:-9px;bottom:-9px;width:32px;height:32px;border-radius:50%;border:2px solid #fff;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .badge svg{width:19px;height:19px;fill:#fff}
  .mflag{display:block;width:100%;height:100%}
  .mflag.cerro{background:repeating-linear-gradient(90deg,var(--cerro) 0 3px,var(--cerro2) 3px 6px)}
  .mflag.oli{background:repeating-linear-gradient(90deg,var(--oli) 0 3px,var(--oli2) 3px 6px)}

  /* BARRA INFERIOR: bot + regalo de prueba */
  #bar{flex:0 0 auto;height:46px;display:flex;align-items:center;justify-content:center;gap:6px;background:#000}
  #bar button{font-family:inherit;font-size:12px;color:#fff;border:3px solid #fff;border-radius:22px;padding:5px 10px;white-space:nowrap}
  #botBtn{background:#16a34a}
  #botBtn.off{background:#6b7280}
  #giftBtn{background:#d97706}
  #giftBtn.off{background:#6b7280}
  .gi{display:inline-block;font-size:16px;line-height:1}
  .gi.spin{animation:gspin .6s ease-out}
  @keyframes gspin{from{transform:rotate(-180deg) scale(.4);opacity:.3}to{transform:none;opacity:1}}
  /* regalo que sube por la vía del equipo cuando llega */
  .giftpop{position:absolute;left:50%;top:40px;z-index:6;font-size:84px;line-height:1;pointer-events:none;
    font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
    transform:translateX(-50%);animation:gpop 2s ease-out forwards}
  @keyframes gpop{
    0%{opacity:0;transform:translateX(-50%) translateY(30px) scale(.3)}
    20%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.25)}
    70%{opacity:1;transform:translateX(-50%) translateY(-20px) scale(1)}
    100%{opacity:0;transform:translateX(-50%) translateY(-60px) scale(1)}}
  .rate{background:#334155;min-width:40px;padding:5px 6px !important}
  .rate.sel{background:#2563eb;border-color:#facc15 !important}

  /* REGALO bajo la bandera de meta (uno por vía) + botón que lo activa/desactiva */
  .slot{position:absolute;left:0;right:0;top:34px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
  .gslot{position:relative;z-index:4;height:70px;font-size:60px;line-height:70px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
  .gslot.in{animation:gdrop .5s ease-out,gbob .9s ease-in-out .5s infinite alternate}
  @keyframes gdrop{from{opacity:0;transform:translateY(-40px) scale(.3)}to{opacity:1;transform:none}}
  @keyframes gbob{from{transform:translateY(0)}to{transform:translateY(6px) scale(1.08)}}
  .gtime{width:64%;height:7px;background:#000a;border:1px solid #fff;border-radius:5px;overflow:hidden;visibility:hidden}
  .gtime i{display:block;height:100%;width:100%;background:#facc15}
  .avin,.pilot{display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:50%}
  .avin{width:100%;height:100%}
  .avin img,.pilot img{width:100%;height:100%;object-fit:cover}
  .pilot{position:absolute;left:33px;top:56px;width:44px;height:44px;border:3px solid #fff;font-size:24px;box-shadow:0 0 8px #000}
  .pilot-name{position:absolute;left:50%;top:104px;transform:translateX(-50%);max-width:104px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;font:10px/1.35 Arial,sans-serif;color:#fff;background:#000b;border-radius:8px;padding:0 6px;
    font-family:'Arial','Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
  /* GAMIFICACIÓN: combo, victorias, hitos */
  .combo{position:absolute;top:3px;right:8px;font-size:13px;color:#facc15;text-shadow:0 0 4px #000}
  .wins{position:absolute;top:3px;left:8px;font-size:13px;color:#facc15;text-shadow:0 0 4px #000}
  .flash{position:absolute;left:50%;top:55%;z-index:6;white-space:nowrap;color:#fff;font-size:26px;pointer-events:none;
    text-shadow:-2px 0 #000,2px 0 #000,0 -2px #000,0 2px #000;animation:gpop 1.6s ease-out forwards}

  /* GANADOR */
  #winner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:10;
    background:#000000b3;color:#fff;font-size:34px;text-align:center;text-transform:uppercase;line-height:1.2}
  #winner.show{display:flex}
</style>
</head>
<body>
<div id="app">
  <div id="connectionIndicator" data-state="connecting" role="status" aria-label="Intentando conectar con TikTok" title="Intentando conectar con TikTok"></div>
  <div id="head">
    <div class="team">
      <small class="wins" id="wCerro"></small><b class="combo" id="cbCerro"></b>
      <div class="capa-bandera"><div class="flag cerro"></div><div class="tname">Cerro</div></div>
      <div class="capa-desp"><div class="fill cerro" id="fCerro"></div><div class="dist" id="mCerro">0 / 100 m</div></div>
    </div>
    <div class="team">
      <small class="wins" id="wOli"></small><b class="combo" id="cbOli"></b>
      <div class="capa-bandera"><div class="flag oli"></div><div class="tname">Olimpia</div></div>
      <div class="capa-desp"><div class="fill oli" id="fOli"></div><div class="dist" id="mOli">0 / 100 m</div></div>
    </div>
  </div>

  <div id="trackwrap">
    <div id="finish"></div>
    <div id="start"></div>
    <div class="lane" id="laneCerro"><div class="turtle" id="tCerro"></div></div>
    <div class="lane" id="laneOli"><div class="turtle" id="tOli"></div></div>
    <div id="alerts"></div>
    <div id="winner"><div id="wtext"></div></div>
  </div>

  <a id="bar" href="dashboard.html" aria-label="Panel"></a>
</div>

<script>
/*
 =====================================================================
  CARRERA DE TORTUGAS · Cerro vs Olimpia · overlay para TikTok LIVE
 =====================================================================

  QUÉ ES
    Una pista vertical con dos tortugas que corren de ABAJO hacia ARRIBA
    hasta la meta (GOAL = 100 m). Gana la primera que toca la meta.
    Cada acción del público suma metros a SU equipo y dibuja una alerta
    (avatar + icono del tipo de evento).

  POR QUÉ ESTA ARQUITECTURA
    El Oukitel C72 ya transmite limitado a 360p. El teléfono NO debe
    calcular nada pesado: solo dibujar. Todo lo demás va fuera de él.

        TikTok LIVE ──► BACKEND (Node) ──WebSocket──► este index.html
                        ├ Ingesta  (TikTok real o bot)        │
                        ├ Motor de carrera (reglas y estado)  ▼
                        └ Difusión (ws)              TikTok "Juegos móviles"
                                                     captura la pantalla

    - El backend es la ÚNICA fuente de verdad (metros, regalos, ganador).
    - Este archivo es un "tonto": recibe, interpola y dibuja.
    - El bot es una ingesta más: entra por la misma puerta que TikTok.

  ESTADO ACTUAL DE ESTE ARCHIVO
    1) Modo demo (sin backend): las reglas viven AQUÍ (handleEvent/addMeters)
       y el bot de abajo emula eventos. Sirve para diseñar y probar.
    2) Con ?ws=wss://TU_SERVIDOR: acepta eventos sueltos y los procesa con
       esas mismas reglas (ver "WebSocket" al final).
    3) PENDIENTE: contrato completo con el backend (state / winner / reset),
       descrito al final. Cuando exista, las reglas de metros se mueven al
       servidor y este archivo solo las muestra.

  REGLAS DE METROS (hoy, en ACTIONS)
    like 3 · comment 1 · join 2 · follow 10 · share 5 (editables en el panel)
    inactividad: tras 10 s sin eventos, avanza al azar 0,1–3 m cada 10 s
    gift: no suma metros; la tortuga crece x3 (GIANT) y camina SOLA hasta
          100 m a GIFT_SPEED m/s y gana.

  GAMIFICACIÓN (v2)
    REGALO DE USUARIO  El regalo NO es automático: lo envía un espectador (evento gift). Al llegar,
          la tortuga de su equipo crece x3 y camina sola; el regalo aparece bajo la bandera de meta de
          esa vía durante GIFT_SHOW s (5 por defecto, con barra de tiempo) y el AVATAR REDONDO de quien lo
          envió se pone sobre el caparazón, con su 🎁 y nombre debajo, hasta que acaba la carrera.
          En dashboard.html: catálogo con casillas (qué regalos se MUESTRAN; el efecto x3 ocurre siempre),
          tiempo en pantalla, mostrar/ocultar por vía y un botón de regalo de prueba.
    SONIDO    Efectos sintetizados (WebAudio) por acción, combo, hito y victoria. Hace falta un toque en la
          página para que el navegador permita el audio.
    VOZ EN OFF  Voz alegre en español (speechSynthesis): lee "usuario dice: comentario" (sin emojis ni
          enlaces, máx. 3 en cola), agradece cada regalo y anuncia al ganador. El evento comment debe traer "text".
    COMBO     Acciones del mismo equipo con menos de COMBO_WINDOW s entre sí encadenan
          racha: cada 4 acciones el multiplicador sube +0,5 (x1,5 · x2 · x2,5 máx.).
          Se ve como 🔥 xN junto al nombre del equipo.
    REMONTADA Si un equipo va más de 15 m por detrás, cada acción suma +1 m extra.
    HITOS     Aviso en la vía a los 25 m, 50 m (¡MITAD!) y 75 m (¡RECTA FINAL!).
    VICTORIAS 🏆 junto al nombre del equipo: carreras ganadas desde que abriste la página.
    MVP       Al ganar se muestra el espectador que más metros aportó al equipo ganador.

  AJUSTES RÁPIDOS
    GOAL          metros de la meta
    GIANT         tamaño con regalo (3 = tres veces; se limita al 75 % del alto de la pista)
    GIFT_SPEED    m/s de la caminata con regalo (5 ≈ 20 s hasta la meta)
    VMAX          m/s máximos del avance visual normal
    --paso (CSS)  duración de cada pisada; más alto = más lenta (patas y caparazón comparten ciclo y solo caminan mientras avanza)
    EVENTS_PER_MIN / GIFT_CHANCE   ritmo del bot (30 | 60 | 90 por minuto)

  CONTROLES: todos viven en dashboard.html (misma ventana/navegador, se guardan solos):
  interruptor de regalos · catálogo con casillas (qué regalos se muestran) · sonido, voz y volumen ·
  cuánto tiempo en pantalla (por defecto 5 s) · interruptor por vía · regalo de prueba · bot (APAGADO por defecto) y su ritmo.
  El pie de la carrera es solo una franja negra con un enlace al panel.
  Al ganar, el cartel dura 3 s y la carrera empieza de nuevo.

  FORMATO: TikTok LIVE VERTICAL (9:16)
    - Diseñado para el teléfono en vertical. En pantalla ancha (PC) se
      muestra un lienzo 9:16 centrado.
    - index.html?live=1  → MODO EN DIRECTO: oculta los botones de prueba (no
      deben salir en el stream) y deja márgenes libres arriba (--safe-top,
      perfil del anfitrión) y abajo (--safe-bottom, chat de TikTok) para que
      la interfaz de TikTok no tape la carrera. Ajusta esos dos valores en
      el CSS (body.live) según lo que veas en tu directo.
    - Con ?ws=... el bot arranca APAGADO, para no mezclar eventos falsos con
      los reales.
    - Ejemplo: index.html?live=1&ws=wss://TU_SERVIDOR
*/

/* ---------- Tortuga vista desde arriba (cabeza hacia ARRIBA) ---------- */
function turtleSVG(id, c1, c2, edge){
  const skin = '#6fae4f', skinDark = '#2e5a2e';
  // dibujo de placas del caparazón (doble trazo para que se vea sobre las franjas)
  const scutes = `
      <polygon points="48,32 58,38 58,50 48,56 38,50 38,38"/>
      <polygon points="48,56 58,62 58,74 48,80 38,74 38,62"/>
      <polygon points="48,80 58,86 58,96 48,101 38,96 38,86"/>
      <path d="M38 38 L24 38 M38 50 L20 54 M38 62 L18 68 M38 74 L19 82 M38 86 L24 96
               M58 38 L72 38 M58 50 L76 54 M58 62 L78 68 M58 74 L77 82 M58 86 L72 96"/>`;
  // pata: sale por debajo del caparazón, con tres uñas; side = -1 izquierda, +1 derecha
  const leg = (cls, cx, cy, rx, ry, side) => {
    const tip = cx + side*(rx - 3);
    return `
    <g class="leg ${cls}">
      <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#sk${id})" stroke="${skinDark}" stroke-width="2.5"/>
      <circle cx="${tip}" cy="${cy-3.5}" r="1.5" fill="#efe9cf"/>
      <circle cx="${tip + side}" cy="${cy}" r="1.5" fill="#efe9cf"/>
      <circle cx="${tip}" cy="${cy+3.5}" r="1.5" fill="#efe9cf"/>
    </g>`;
  };
  return `
  <svg viewBox="0 0 96 120">
    <defs>
      <pattern id="st${id}" x="0" y="0" width="20" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" fill="${c1}"/><rect x="10" width="10" height="10" fill="${c2}"/>
      </pattern>
      <radialGradient id="sh${id}" cx="45%" cy="38%" r="70%">
        <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity=".4"/>
      </radialGradient>
      <radialGradient id="sk${id}" cx="40%" cy="35%" r="75%">
        <stop offset="0" stop-color="#9ad06b"/><stop offset="1" stop-color="${skin}"/>
      </radialGradient>
    </defs>

    <!-- sombra -->
    <ellipse cx="52" cy="74" rx="38" ry="48" fill="#000" opacity=".28"/>

    <!-- cola -->
    <path d="M43 106 Q48 124 53 106 Z" fill="${skin}" stroke="${skinDark}" stroke-width="2"/>

    <!-- 4 patas simétricas (delantera izq + trasera der a la vez; delantera der + trasera izq a la vez) -->
    ${leg('a', 17, 46, 11, 7.5, -1)}
    ${leg('b', 79, 46, 11, 7.5,  1)}
    ${leg('b', 18, 90, 10, 7,   -1)}
    ${leg('a', 78, 90, 10, 7,    1)}

    <!-- cuello y cabeza con emoticón de estado de ánimo -->
    <path d="M40 30 Q40 20 42 12 L54 12 Q56 20 56 30 Z" fill="url(#sk${id})" stroke="${skinDark}" stroke-width="2"/>
    <ellipse cx="48" cy="13" rx="15" ry="15" fill="url(#sk${id})" stroke="${skinDark}" stroke-width="2.5"/>
    <text id="mood${id}" x="48" y="13" text-anchor="middle" dominant-baseline="central" font-size="26"
          style="font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif">😐</text>

    <!-- caparazón = bandera del equipo -->
    <ellipse cx="48" cy="68" rx="32" ry="42" fill="url(#st${id})" stroke="${edge}" stroke-width="4"/>
    <ellipse cx="48" cy="68" rx="32" ry="42" fill="url(#sh${id})"/>
    <g fill="none" stroke-linejoin="round" stroke-linecap="round">
      <g stroke="#fff" stroke-width="4" opacity=".5">${scutes}</g>
      <g stroke="#000" stroke-width="1.6" opacity=".75">${scutes}</g>
    </g>
    <ellipse cx="38" cy="48" rx="10" ry="16" fill="#fff" opacity=".18" transform="rotate(-20 38 48)"/>
  </svg>`;
}
document.getElementById('tCerro').innerHTML = turtleSVG('c', '#0d3b9e', '#d3202f', '#ffffff');
document.getElementById('tOli').innerHTML   = turtleSVG('o', '#ffffff', '#111111', '#ffffff');

/* ---------- Estado de la carrera ---------- */
const GOAL = 100;          // metros de la meta
const GIANT = 3;           // tamaño de la tortuga con regalo (3 veces)
const GIFT_SPEED = 5;      // m/s: con regalo camina sola hasta los 100 m (≈20 s)
const VMAX = 4;            // m/s: velocidad visual máxima normal (pisada lenta)
let GIFT_SHOW = 5;       // s que el regalo queda en pantalla (bajo la bandera de meta)
const COMBO_WINDOW = 5;    // s máximos entre acciones para mantener la racha
let giftsOn = true;        // mostrar el regalo gráfico (los regalos los envían los usuarios)
const GIFT_CHANCE = 0.02;  // solo el bot: probabilidad de que un evento sea regalo
const IDLE_EVERY = 10;     // s sin eventos globales antes de avanzar; se repite cada 10 s
const IDLE_MIN = 0.1, IDLE_MAX = 3;   // m al azar que avanza en cada empujón de inactividad
const BASE_H = 138;        // alto base de la tortuga en px (igual que en el CSS)

const teams = {
  cerro: {el:document.getElementById('tCerro'), lane:document.getElementById('laneCerro'), m:document.getElementById('mCerro'),
          f:document.getElementById('fCerro'), mood:document.getElementById('moodc'), name:'Cerro', dir:1,
          meters:0, gift:false, moodEmoji:'', moodUntil:0, moodShown:''},
  oli:   {el:document.getElementById('tOli'),   lane:document.getElementById('laneOli'),   m:document.getElementById('mOli'),
          f:document.getElementById('fOli'),   mood:document.getElementById('moodo'), name:'Olimpia', dir:-1,
          meters:0, gift:false, moodEmoji:'', moodUntil:0, moodShown:''}
};
const other = k => k === 'cerro' ? 'oli' : 'cerro';
for(const k in teams){
  const t = teams[k], C = k === 'cerro' ? 'Cerro' : 'Oli';
  Object.assign(t, {idle:0, wins:0, combo:0, comboAt:-1e9, ms:0, users:{}, autoOn:true, pilot:null, gtimer:0,
                    cb:document.getElementById('cb' + C), w:document.getElementById('w' + C)});
  t.slot = document.createElement('div'); t.slot.className = 'slot';
  t.slot.innerHTML = '<div class="gslot"></div><div class="gtime"><i></i></div>';
  t.lane.appendChild(t.slot);
  t.gs = t.slot.children[0]; t.gt = t.slot.children[1]; t.gbar = t.gt.firstChild;
}
let lastEventAt = performance.now();
for(const k in teams) teams[k].idle = lastEventAt;
function hideSlot(k){ const t = teams[k]; clearTimeout(t.gtimer); t.gs.textContent = ''; t.gt.style.visibility = 'hidden'; }
function showGift(k, emoji){             // el regalo aparece bajo la bandera de meta GIFT_SHOW s
  const t = teams[k];

  clearTimeout(t.gtimer); t.gtimer = setTimeout(() => hideSlot(k), GIFT_SHOW * 1000);
}
function clearPilot(k){ const t = teams[k]; if(t.pilot){ t.pilot.forEach(x => x.remove()); t.pilot = null; } }
function setPilot(k, ev){                // avatar redondo del que envió el regalo, sobre el caparazón, y debajo su nombre
  const t = teams[k]; clearPilot(k);
  const d = document.createElement('div'); d.className = 'pilot'; fillAvatar(d, ev);

const comboMult = (t, now) => now - t.comboAt < COMBO_WINDOW * 1000 ? 1 + Math.floor(t.combo / 4) * 0.5 : 1;
function flash(k, text){
  const d = document.createElement('div'); d.className = 'flash'; d.textContent = text;
  teams[k].lane.appendChild(d); setTimeout(() => d.remove(), 1600);

function mvp(k){
  const u = teams[k].users; let best = '', n = 0;
  for(const name in u) if(u[name] > n){ n = u[name]; best = name; }
  return best;
}
let shown = {cerro:0, oli:0};           // posición visual (metros)
let scale = {cerro:1, oli:1};           // tamaño visual
let finished = false, winner = null, last = 0;

/* Estado de ánimo que se ve en la cabeza */
function moodOf(k, now){
  const t = teams[k], o = teams[other(k)];
  if(finished) return winner === k ? '🥳' : '😭';
  if(t.gift) return '🤩';
  if(now < t.moodUntil) return t.moodEmoji;      // reacción a lo último que pasó
  const d = t.meters - o.meters;
  if(d > 8)  return '😎';                        // va ganando
  if(d < -8) return '😟';                        // va perdiendo
  return t.meters >= GOAL * 0.8 ? '😤' : '😐';   // recta final / normal
}

function render(ts){
  const dt = Math.min((ts - (last || ts)) / 1000, 0.1); last = ts;
  const h = teams.cerro.lane.clientHeight, w = teams.cerro.lane.clientWidth, finishH = 28;

  for(const k in teams){
    const t = teams[k];

    // regalo: camina sola hacia la meta
    if(t.gift && !finished) t.meters = Math.min(GOAL, t.meters + GIFT_SPEED * dt);

    // Inactividad global: espera IDLE_EVERY s sin eventos y luego avanza a intervalos iguales.
    if(!finished && !t.gift && ts - lastEventAt >= IDLE_EVERY * 1000 && ts - t.idle >= IDLE_EVERY * 1000){
      t.idle = ts;
      addMeters(k, Math.round((IDLE_MIN + Math.random() * (IDLE_MAX - IDLE_MIN)) * 10) / 10);
    }

    // avance visual suave con velocidad limitada
    const vmax = (t.gift ? GIFT_SPEED : VMAX) * dt;
    const diff = t.meters - shown[k];
    const prev = shown[k];
    shown[k] += Math.max(-vmax, Math.min(vmax, diff * (1 - Math.exp(-6 * dt))));
    if(shown[k] - prev > 0.002) t.walkUntil = ts + 600;      // avanzando: patas y caparazón se mueven
    t.el.classList.toggle('walk', ts < t.walkUntil);

    // tamaño: crece 3 veces con regalo
    // con regalo crece hasta GIANT veces, sin pasar del 75 % del alto de la pista (para que pueda caminar a la meta)
    const gmax = Math.max(1, Math.min(GIANT, (h - finishH - 8) * 0.75 / BASE_H));
    scale[k] += ((t.gift ? gmax : 1) - scale[k]) * (1 - Math.exp(-2.5 * dt));

    const s = scale[k];
    const travel = Math.max(0, h - BASE_H * s - finishH - 8);   // de abajo (inicio) a la meta
    const p = Math.min(shown[k] / GOAL, 1);
    const dx = t.dir * Math.max(0, (t.el.offsetWidth * s - w) / 2);   // empuja hacia dentro para no salirse de la pantalla
    t.el.style.top = (h - BASE_H) + 'px';
    t.el.style.transform = `translate(${dx}px, ${-(p * travel) - 8}px) scale(${s})`;
    t.el.style.zIndex = s > 1.2 ? 3 : 2;

    t.m.textContent = Math.floor(Math.min(t.meters, GOAL)) + ' / ' + GOAL + ' m';
    t.f.style.width = (p * 100) + '%';

    // gamificación: combo visible e hitos
    const cm = comboMult(t, ts); t.cb.textContent = cm > 1 ? '🔥 x' + cm : '';
    const ms = Math.min(3, Math.floor(t.meters / 25));
    if(ms > t.ms && !finished){ t.ms = ms; flash(k, ['', '25 m', '¡MITAD! 🔥', '¡RECTA FINAL! 🏁'][ms]); sfx('hito'); }

    const e = moodOf(k, ts);
    if(e !== t.moodShown){ t.mood.textContent = e; t.moodShown = e; }

    // llegada: gana el primero que realmente toca la meta
    if(!finished && shown[k] >= GOAL - 0.3) win(k);
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

function win(k){
  finished = true; winner = k;
  document.getElementById('app').classList.add('stop');
  teams[k].wins++; teams[k].w.textContent = '🏆' + teams[k].wins;
  document.getElementById('wtext').innerHTML = '🏆<br>¡Gana<br>' + teams[k].name + '!<br><small id="mvp" style="font-size:18px"></small>';
  const star = mvp(k); if(star) document.getElementById('mvp').textContent = '⭐ MVP ' + star;   // textContent: el nombre viene de fuera
  document.getElementById('winner').classList.add('show');
  sfx('win'); say('¡Gana ' + teams[k].name + '!');
  setTimeout(reset, 3000);
}

function addMeters(team, n){            // <- AQUÍ conectas tus eventos (likes, comentarios, etc.)
  if(finished) return;
  teams[team].meters = Math.min(GOAL, teams[team].meters + n);
}

function reset(){
  lastEventAt = performance.now();
  for(const k in teams){
    const t = teams[k];
    t.meters = 0; t.gift = false; t.moodUntil = 0;
    t.combo = 0; t.comboAt = -1e9; t.ms = 0; t.idle = lastEventAt; t.users = {}; hideSlot(k);
    clearPilot(k); t.cb.textContent = '';
    shown[k] = 0; scale[k] = 1;
  }
  finished = false; winner = null;
  document.getElementById('app').classList.remove('stop');
  document.getElementById('winner').classList.remove('show');
}

/* ---------- SONIDO (WebAudio, sin archivos) + VOZ EN OFF (speechSynthesis) ----------
   Los navegadores exigen un toque/clic en la página antes de dejar sonar: toca una vez.
   (En OBS/fuente navegador: --autoplay-policy=no-user-gesture-required.) */
let AC = null, sfxOn = true, voiceOn = true, vol = 0.7, esVoice = null, sayQ = 0;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(_){} }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
let unlocked = false;
['pointerdown', 'keydown', 'touchstart'].forEach(n => addEventListener(n, () => {
  ac(); if(!unlocked && window.speechSynthesis){ unlocked = true; try{ speechSynthesis.speak(new SpeechSynthesisUtterance('')); }catch(_){} }
}, {passive:true}));
function tone(f, t0, d, type, g, f2){
  if(!AC) return;
  const T = AC.currentTime + t0, o = AC.createOscillator(), a = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, T); if(f2) o.frequency.exponentialRampToValueAtTime(f2, T + d);
  a.gain.setValueAtTime(0.0001, T); a.gain.exponentialRampToValueAtTime(g * vol, T + 0.01); a.gain.exponentialRampToValueAtTime(0.0001, T + d);
  o.connect(a); a.connect(AC.destination); o.start(T); o.stop(T + d + 0.03);
}
const SFX = {
  like:   () => tone(880, 0, .08, 'sine', .12, 1320),
  comment:() => { tone(659, 0, .1, 'triangle', .2); tone(880, .09, .14, 'triangle', .2); },
  follow: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .07, .14, 'triangle', .22)),
  share:  () => tone(300, 0, .25, 'sawtooth', .1, 1200),
  join:   () => { tone(440, 0, .08, 'square', .09); tone(660, .08, .1, 'square', .09); },
  gift:   () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .08, .22, 'triangle', .25)); tone(2093, .45, .4, 'sine', .12); },
  combo:  () => tone(600, 0, .18, 'square', .1, 1500),
  hito:   () => [784, 988, 1175].forEach((f, i) => tone(f, i * .1, .2, 'triangle', .25)),
  win:    () => [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .2, 'square', .14))
};
const lastSfx = {};
function sfx(n){
  if(!sfxOn || !ac() || !SFX[n]) return;
  const now = performance.now(); if(now - (lastSfx[n] || 0) < (n === 'like' ? 150 : 60)) return;
  lastSfx[n] = now; try{ SFX[n](); }catch(_){}
}
function pickVoice(){
  const v = speechSynthesis.getVoices();
  esVoice = v.find(x => /^es/i.test(x.lang) && /sabina|helena|paulina|laura|monica|female|google/i.test(x.name)) || v.find(x => /^es/i.test(x.lang)) || null;
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const spokenName = u => String(u).replace(/[_.\-]+/g, ' ').replace(/\d+/g, ' ').trim() || 'alguien';
function say(text){                      // voz animada; sin emojis ni enlaces; máx. 3 frases en cola
  if(!voiceOn || !window.speechSynthesis || sayQ >= 3) return;
  text = String(text).replace(/https?:\S+/g, '').replace(/[\p{Extended_Pictographic}\u200d\ufe0f]/gu, '').slice(0, 140).trim();
  if(!text) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = esVoice ? esVoice.lang : 'es-ES'; if(esVoice) u.voice = esVoice;
  u.pitch = 1.5; u.rate = 1.15; u.volume = vol;
  sayQ++; u.onend = u.onerror = () => { sayQ = Math.max(0, sayQ - 1); };
  speechSynthesis.speak(u);
}

/* ---------- BOT: emula 30 eventos por minuto (1 cada 2 s) ---------- */
let EVENTS_PER_MIN = 30;                // 30, 60 o 90 (botones de abajo)
const POOL = ['like','like','like','like','like','like','like','like','like','comment','comment','comment','comment',
              'follow','follow','share','share','join','join','join'];
const pick = a => a[Math.floor(Math.random()*a.length)];
const PHRASES = ['vamos cerro, tú puedes','arriba olimpia','qué carrera tan buena','saludos desde Ciudad del Este','dale tortuga dale',
                 'no se rindan','jajaja qué rápido','esta es la mía','fuerza equipo','quién gana hoy'];
function botEvent(){
  const type = Math.random() < GIFT_CHANCE ? 'gift' : pick(POOL);
  handleEvent({team: Math.random()<.5 ? 'cerro' : 'oli', type, user: pick(NAMES),
               gift: type === 'gift' ? pick(GIFTS).k : undefined, text: type === 'comment' ? pick(PHRASES) : undefined});
}
let botTimer = null, botOn = null;
function setBot(on){ clearInterval(botTimer); botTimer = null; if(on) botTimer = setInterval(botEvent, 60000 / EVENTS_PER_MIN); }

/* ---------- CONFIGURACIÓN (la escribe dashboard.html en localStorage 'tortugas.cfg') ----------
   {on, show(s), gifts:[claves], lanes:{cerro,oli}, meters:{like,comment,follow,share,join}, sound, voice, vol(0-100), bot, rate, cmd:{id,name:'gift',team}}
   Por defecto: regalo 5 s en pantalla, todo el catálogo, sonido y voz activos, bot APAGADO. */
const CFG_KEY = 'tortugas.cfg';
let cfg = {}, poolGifts = GIFTS, lastCmd = 0;
function loadCfg(){ try{ return JSON.parse(localStorage.getItem(CFG_KEY) || '{}'); }catch(_){ return {}; } }
function saveCfg(p){ cfg = Object.assign({}, loadCfg(), p); try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(_){} }
function setGift(on){ giftsOn = on; if(!on) for(const k in teams){ hideSlot(k); clearPilot(k); } }
function setLane(k, on){ teams[k].autoOn = on; if(!on){ hideSlot(k); clearPilot(k); } }   // solo oculta el regalo gráfico de esa vía
function applyCfg(c){
  cfg = c || {};
  GIFT_SHOW = cfg.show > 0 ? cfg.show : 5;
  poolGifts = Array.isArray(cfg.gifts) ? GIFTS.filter(g => cfg.gifts.includes(g.k)) : GIFTS;
  setGift(cfg.on !== false);
  for(const k in teams) if(cfg.lanes && k in cfg.lanes && cfg.lanes[k] !== teams[k].autoOn) setLane(k, cfg.lanes[k]);
  const rate = [30, 60, 90].includes(cfg.rate) ? cfg.rate : 30, bot = !wsUrl && cfg.bot === true;
  if(bot !== botOn || rate !== EVENTS_PER_MIN){ botOn = bot; EVENTS_PER_MIN = rate; setBot(bot); }
  sfxOn = cfg.sound !== false; voiceOn = cfg.voice !== false; vol = (cfg.vol >= 0 && cfg.vol <= 100 ? cfg.vol : 70) / 100;
  if(!voiceOn && window.speechSynthesis) speechSynthesis.cancel();
  if(cfg.cmd && cfg.cmd.id !== lastCmd){          // regalo de prueba desde el panel (como si lo mandara un usuario)
    lastCmd = cfg.cmd.id; const t = teams[cfg.cmd.team];
    if(cfg.cmd.name === 'gift' && t && !t.gift) handleEvent({team:cfg.cmd.team, type:'gift', gift:pick(poolGifts.length ? poolGifts : GIFTS).k, user:'usuario_prueba'});
  }
}
addEventListener('storage', e => { if(e.key === CFG_KEY) applyCfg(loadCfg()); });

       · Metros por acción: like 3 · comment 1 · join 2 · follow 10 · share 5 (editables en el panel).
       · COMBO: acciones del mismo equipo con < 5 s entre sí encadenan racha;
         multiplicador = 1 + floor(racha / 4) * 0.5 (x1, x1.5, x2, x2.5...). Si pasan 5 s, racha = 1.
       · REMONTADA: si el equipo va > 15 m por detrás del rival, cada acción suma +1 m.
       · INACTIVIDAD: tras 10 s sin eventos, cada equipo suma al azar 0.1–3.0 m
         (un decimal) cada 10 s mientras no lleguen nuevos eventos.
         No aplica a un equipo con regalo activo (camina solo) ni con la carrera terminada.
         Cualquier evento reinicia el contador global. No genera alerta: solo cambia los metros.
       · REGALO (gift): no suma metros; el equipo pasa a "gift:true" (tortuga x3) y el
         servidor le suma 5 m/s hasta 100 m (GIFT_SPEED). Un regalo real se entrega al instante.
       · REGALO DE USUARIO: lo dispara un evento gift real (nunca por temporizador). Enviar "gift" (clave del
         catálogo), "user" y "avatar" (URL ~64 px). El overlay decide qué mostrar según la config.
       · COMENTARIOS: reenviar "text" ya MODERADO (insultos, enlaces, spam, longitud máx. ~100) porque la
         voz lo lee en directo; descartar lo dudoso.
       · META: al llegar a 100 m → enviar "winner" (con MVP) → esperar 3 s → "reset".
         Las victorias (🏆) se acumulan mientras el servidor esté vivo.
       · HITOS 25/50/75 m y MVP (espectador con más metros aportados al equipo ganador):
         el overlay los deduce hoy; si prefieres, envíalos tú como parte de "event"/"winner".
    c) DIFUSIÓN  WebSocket (ws) a todos los overlays. Un único mensaje JSON por frame.

  2) CONFIGURACIÓN DEL PANEL (dashboard.html)
    Hoy el panel guarda en localStorage 'tortugas.cfg' (solo sirve en el MISMO navegador).
    Con backend, el panel debe enviar esto al servidor (con token) y el servidor lo reenvía:
      {"cmd":"config","cfg":{
         "on":true,                       mostrar los regalos gráficos de usuarios
         "show":5,                        segundos que el regalo queda en pantalla
         "gifts":["rose","donut",...],    catálogo marcado (claves de GIFTS)
         "lanes":{"cerro":true,"oli":true},   regalo activo por vía
         "meters":{"like":3,"comment":1,"follow":10,"share":5,"join":2},   metros por evento
         "sound":true,"voice":true,"vol":70,  efectos, voz en off y volumen (0-100)
         "bot":false, "rate":30 }}        bot de pruebas (30|60|90 por min); apagado por defecto
      {"cmd":"gift","team":"cerro"}       regalo de prueba
    Catálogo de claves: rose donut heart confetti corgi lion galaxy ice rocket diamond crown car
    fireworks music star. Si el regalo real de TikTok trae otra clave, el overlay muestra 🎁.

  3) QUÉ DESACTIVAR EN ESTE ARCHIVO CUANDO EL SERVIDOR ASUMA LAS REGLAS
    · handleEvent(): quitar combo, remontada, MVP y addMeters (dejar solo showAlert + estado de ánimo).
    · render(): quitar el bloque de INACTIVIDAD, el de regalo que "camina sola" y el de
      metros locales; los metros llegan en "state".
    · showGift()/setPilot() ya solo se llaman con eventos gift reales (no hay temporizador de regalos).
    · BOT: no arrancar nunca (ya no arranca con ?ws=).
    · Mantener: dibujo, interpolación suave, alertas, estado de ánimo, cartel de ganador.

  4) CRITERIOS DE ACEPTACIÓN
    · Con la página abierta 1 minuto sin eventos, ambos equipos avanzan ~0.1–3 m cada 10 s.
    · Cualquier evento reinicia el contador global de inactividad de 10 s.
    · Al ganar: cartel 3 s y reinicio automático; las victorias se conservan.
    · Mensajes perdidos se corrigen con el siguiente "state" (metros ABSOLUTOS).
*/

/*
 =====================================================================
  CONTRATO CON EL BACKEND (WebSocket, JSON, un mensaje por frame)
 =====================================================================
  Estado: lo marcado [HOY] ya lo entiende este archivo;
          lo marcado [PROPUESTO] es el contrato objetivo del backend.

  SERVIDOR → OVERLAY

  [HOY] Evento suelto (se procesa con las reglas locales):
    { "team":"cerro"|"oli",
      "type":"like"|"comment"|"follow"|"share"|"join"|"gift",
      "user":"juan_pyg",
      "gift":"rose",
      "avatar":"https://…/64.jpg",   // opcional: foto redonda del usuario (si falta, una cara de color)
      "text":"¡vamos cerro!" }       // solo type=comment: la voz en off lo lee
                            // "gift" es opcional y solo para type=gift: rose | donut | heart | confetti | corgi | lion | galaxy
                            // (si no viene o no se conoce, se muestra 🎁)

  [PROPUESTO] Foto completa. Se envía al conectar y cada ~5 s. Lleva metros
  ABSOLUTOS para que un mensaje perdido se corrija con el siguiente:
    { "type":"state", "seq":1042, "goal":100,
      "phase":"racing"|"finished", "winner":null|"cerro"|"oli",
      "teams":{ "cerro":{"meters":37.5,"gift":false},
                "oli":  {"meters":41.0,"gift":true} } }

  [PROPUESTO] Evento puntual (dibuja la alerta; el servidor ya sumó metros):
    { "type":"event", "seq":1043, "team":"cerro",
      "kind":"like"|"comment"|"follow"|"share"|"join"|"gift",
      "user":{ "id":"123", "name":"juan_pyg", "avatar":"https://…/64.jpg" },
      "count":1 }

  [PROPUESTO] Fin y reinicio de carrera:
    { "type":"winner", "team":"oli" }
    { "type":"reset" }

  OVERLAY → SERVIDOR (solo panel de control, con token; nunca puntos)
  [PROPUESTO]
    { "cmd":"bot",  "on":true, "rate":60 }      rate: 30 | 60 | 90
    { "cmd":"gift", "team":"cerro" }            regalo de prueba

  REGLAS DEL CONTRATO
    - seq crece siempre; el overlay ignora mensajes con seq viejo.
    - Likes: el servidor los agrupa (~500 ms) y manda un solo event con count.
    - Regalos en combo: contar una vez, al terminar la racha.
    - Avatares: el servidor los reduce (~64 px) y los sirve; el teléfono no
      debe bajar imágenes grandes.
    - Reconexión: el overlay reintenta con espera creciente, hace ping cada
      ~15 s y al volver espera un "state" completo.
    - Seguridad: wss:// si la página va por HTTPS; comandos con token; el
      servidor nunca confía en los metros que diga el cliente.
    - Equipo de cada usuario: lo decide el servidor (p. ej. primer comentario
      con "cerro" u "olimpia" = evento join). Pendiente: qué hacer con los
      likes de quien aún no eligió equipo.
*/

/* ---------- WebSocket (opcional): index.html?ws=wss://TU_SERVIDOR
   Formato que el front entiende HOY (un evento suelto):
   {"team":"cerro","type":"like","user":"juan_pyg"}
   (type: like | comment | follow | share | join | gift)                   */
const qs = new URLSearchParams(location.search);
const connectionIndicator = document.getElementById('connectionIndicator');
function updateConnectionIndicator(state){
  const connected = state === 'connected';
  const failed = state === 'failed' || state === 'disconnected';
  const label = connected ? 'TikTok conectado' : failed ? 'TikTok desconectado' : 'Intentando conectar con TikTok';
  connectionIndicator.dataset.state = connected ? 'connected' : failed ? 'failed' : 'connecting';
  connectionIndicator.setAttribute('aria-label', label);
  connectionIndicator.title = label;
}
if(qs.has('live')){                     // modo directo: sin botones de prueba y con márgenes libres para la interfaz de TikTok
  document.body.classList.add('live');
  document.getElementById('bar').style.display = 'none';
}
const wsUrl = qs.get('ws') || (location.protocol === 'http:' || location.protocol === 'https:'
  ? (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'
  : '');
if(wsUrl){
  let retryDelay = 1000;
  const connectOverlay = () => {
    const ws = new WebSocket(wsUrl);
    ws.onopen = () => { retryDelay = 1000; };
    ws.onmessage = e => {
      try{
        const d = JSON.parse(e.data);
        if(d.type === 'connection' && d.status) updateConnectionIndicator(d.status.state);
        else if(d.type === 'raceEvent' && d.event) handleEvent(d.event);
        else if(d.type === 'config' && d.config) applyCfg(d.config);
        else if(ACTIONS[d.type] && teams[d.team]) handleEvent(d);
        else if(d.team && Number.isFinite(Number(d.meters))) addMeters(d.team, Number(d.meters));
      }catch(error){ console.error('No se pudo procesar el mensaje del servidor:', error); }
    };
    ws.onclose = () => { updateConnectionIndicator('retrying'); setTimeout(connectOverlay, retryDelay); retryDelay = Math.min(retryDelay * 2, 10000); };
    ws.onerror = () => ws.close();
  };
  connectOverlay();
}
lastCmd = (loadCfg().cmd || {}).id || 0;
applyCfg(loadCfg());                    // arranca con lo guardado en el panel (o los valores por defecto)
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(error => console.warn('No se pudo registrar la PWA:', error));
}
let wakeLock = null, fullscreenRequested = false;
async function keepScreenAwake(){
  if(document.visibilityState !== 'visible' || !('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); }
  catch(error) { console.warn('El navegador no permitió mantener la pantalla activa:', error); }
}
document.addEventListener('pointerdown', () => {
  keepScreenAwake();
  if(!fullscreenRequested && document.documentElement.requestFullscreen){
    fullscreenRequested = true;
    document.documentElement.requestFullscreen().catch(error => console.warn('No se pudo activar pantalla completa:', error));
  }
}, {once:true, passive:true});
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') keepScreenAwake();
});
</script>
